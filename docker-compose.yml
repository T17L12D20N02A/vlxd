services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vinakhang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinakhang}
      POSTGRES_DB: ${POSTGRES_DB:-vinakhang}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinakhang} -d ${POSTGRES_DB:-vinakhang}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vinakhang}:${POSTGRES_PASSWORD:-vinakhang}@db:5432/${POSTGRES_DB:-vinakhang}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-vinakhang}
      ADMIN_SECRET: ${ADMIN_SECRET:-vinakhang-docker-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
